<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Clientes{% endblock %} · Gestión de clientes</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <a class="marca" href="{{ url_for('lista') }}">Gestión de clientes</a>
    <a class="btn primario" href="{{ url_for('nuevo') }}">+ Nuevo cliente</a>
  </header>
  <main>
    {% with mensajes = get_flashed_messages(with_categories=true) %}
      {% for categoria, texto in mensajes %}
        <div class="aviso {{ categoria }}" role="alert">{{ texto }}</div>
      {% endfor %}
    {% endwith %}
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
